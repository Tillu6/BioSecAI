apiVersion: apps/v1
kind: Deployment
metadata:
  name: biosec-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biosec
  template:
    metadata:
      labels:
        app: biosec
    spec:
      containers:
      - name: backend
        image: gcr.io/your-project/biosec-backend:latest
        ports:
        - containerPort: 3001
      - name: frontend
        image: gcr.io/your-project/biosec-frontend:latest
        ports:
        - containerPort: 3000